<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<!-- Unique Font -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Orbitron', sans-serif; /* changed font */
    overflow: auto;
  }

  body {
    background: url('gempic.png') no-repeat center center;
    background-size: cover;
    background-attachment: fixed;
  }

  .overlay {
    position: relative;
    min-height: 100%;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    padding: 20px;
  }

  .overlay img {
    width: 220px; /* increased size */
    height: 220px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid white;
    margin-bottom: 20px;

    opacity: 0.85; /* slight transparency */
  }

  h1 {
    font-size: 50px;
    margin: 0;
    letter-spacing: 3px;
  }

  p {
    font-size: 20px;
    margin-top: 15px;
    letter-spacing: 1px;
  }

  .overlay h1, .overlay p, .overlay img {
    animation: fadeIn 1.5s ease forwards;
    opacity: 0;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @media (max-width: 768px) {
    h1 { font-size: 32px; }
    p { font-size: 16px; }
    .overlay img { width: 150px; height: 150px; } /* responsive size */
  }
</style>
</head>

<body>

<div class="overlay">
  <img src="nikhillogo.jpeg" alt="Your Image">

  <h1>Coming Soon ..🔥🚀</h1>
  <p>Get Ready for Something Amazing .... ✨</p>
</div>

</body>
</html>
