<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: auto; /* scrollable */
  }

  /* Full screen background image */
  body {
    background: url('gempic.png') no-repeat center center;
    background-size: cover;
    background-attachment: fixed;
  }

  /* Black overlay for readability */
  .overlay {
    position: relative;
    min-height: 100%;
    background: rgba(0, 0, 0, 0.4); /* semi-transparent black */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    padding: 20px;
  }

  .overlay img {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid white;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 50px;
    margin: 0;
    letter-spacing: 3px;
  }

  p {
    font-size: 20px;
    margin-top: 15px;
    letter-spacing: 1px;
  }

  /* Optional: subtle fade-in animation */
  .overlay h1, .overlay p, .overlay img {
    animation: fadeIn 1.5s ease forwards;
    opacity: 0;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @media (max-width: 768px) {
    h1 { font-size: 32px; }
    p { font-size: 16px; }
    .overlay img { width: 120px; height: 120px; }
  }
</style>
</head>
<body>

    

<div class="overlay">
  <img src="nikhillogo.jpeg" alt="Your Image">
  <h1 style="font-style: italic">Coming Soon 🔥🚀</h1>
  <p style="font-style: italic;">Tvaralo vastham kummedham .... 😎⚡</p>
</div>

</body>
</html>
