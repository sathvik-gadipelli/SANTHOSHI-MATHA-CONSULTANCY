<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<meta name="author" content="Developed by Roshan Tech Hub">


<link rel="manifest" href="manifest-admin.json">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top,#0f172a,#020617);
  color:#fff;
  overflow-x:hidden;
}

/* SPLASH ANIMATION */
#splash{
  position:fixed;
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#020617;
  z-index:9999;
  font-size:36px;
  font-weight:bold;
  letter-spacing:2px;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow{
  from{opacity:0.5;}
  to{opacity:1;}
}

/* GLASS */
.glass{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(25px);
  padding:40px;
  border-radius:20px;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
  text-align:center;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:250px;
  height:100%;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(25px);
  border-right:1px solid rgba(255,255,255,0.1);
  padding:20px;
}

.sidebar h3{
  margin-bottom:20px;
  text-align:center;
}

.sidebar button{
  width:100%;
  margin:10px 0;
  padding:12px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,0.08);
  color:#fff;
  cursor:pointer;
  transition:0.3s;
}

.sidebar button:hover{
  background:#2563eb;
  transform:scale(1.05);
}

/* MAIN */
.main{
  margin-left:270px;
  padding:100px 25px 25px; /* top space for header */
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* CARDS */
.card{
  background:rgba(255,255,255,0.08);
  padding:20px;
  margin:12px;
  border-radius:20px;
  backdrop-filter:blur(20px);
  transition:0.3s;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.card:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 15px 40px rgba(0,0,0,0.7);
}

/* NOTIFICATION PANEL UPGRADE */
#notiPanel{
  position:fixed;
  top:0;
  right:-400px;
  width:350px;
  height:100vh;
  background:rgba(15,23,42,0.98);
  backdrop-filter:blur(30px);
  padding:20px;
  transition:0.4s ease;
  z-index:999;
  overflow:auto;
  box-shadow:-10px 0 30px rgba(0,0,0,0.7);
}

#notiPanel.active{
  right:0;
}

/* NOTIFICATION ITEMS */
.noti-item{
  background:rgba(255,255,255,0.08);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn{
  from{transform:translateX(50px); opacity:0;}
  to{transform:translateX(0); opacity:1;}
}

/* BADGE */
#notiCount{
  background:red;
  padding:3px 8px;
  border-radius:50%;
}


.topbar{
  position:fixed;
  left:250px;
  right:0;
  top:0;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.05);
  border-bottom:1px solid rgba(255,255,255,0.1);
  z-index:100;
}

/* LEFT */
.top-left h2{
  font-size:20px;
  font-weight:600;
}

/* CENTER SEARCH */
.search-box{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,0.08);
  padding:8px 14px;
  border-radius:12px;
  transition:0.3s;
}

.search-box input{
  border:none;
  outline:none;
  background:transparent;
  color:white;
  width:220px;
}

.search-box:hover{
  box-shadow:0 0 10px #2563eb;
}

/* RIGHT */
.top-right{
  display:flex;
  align-items:center;
  gap:15px;
}

/* ICON BUTTON */
.icon-btn{
  position:relative;
  background:rgba(255,255,255,0.08);
  border:none;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
  color:white;
}

.icon-btn:hover{
  background:#2563eb;
  transform:scale(1.1);
}

/* NOTIFICATION BADGE */
.icon-btn span{
  position:absolute;
  top:-5px;
  right:-5px;
  background:red;
  font-size:10px;
  padding:2px 6px;
  border-radius:50%;
}

/* PROFILE */
.profile{
  background:linear-gradient(135deg,#2563eb,#9333ea);
  padding:8px 12px;
  border-radius:20px;
  font-size:14px;
}


/* OVERLAY */
#overlay{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  background:rgba(0,0,0,0.6);
  display:none;
  z-index:998;
}


#login{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
}

.noti-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

#notiList{
  padding-bottom:80px; /* space for button */
}



#clearBtn:hover{
  transform:scale(1.1);
}

/* USER CARD UI */
.user-card{
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:20px;
  text-align:center;
  cursor:pointer;
  transition:0.4s;
  position:relative;
  overflow:hidden;
}

.user-card:hover{
  transform:translateY(-8px) scale(1.04);
  box-shadow:0 20px 50px rgba(0,0,0,0.7);
}

/* AVATAR */
.avatar{
  width:60px;
  height:60px;
  border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#9333ea);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  margin:auto;
  margin-bottom:10px;
}

/* STATUS */
.status{
  margin-top:10px;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
}

.status.active{
  background:#16a34a;
}

.status.blocked{
  background:#ef4444;
}

.btn{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:rgba(255,255,255,0.1);
  color:white;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.08);
}

.btn.blue{ background:#2563eb; }
.btn.red{ background:#ef4444; }
.btn.orange{ background:#f59e0b; }

/* USER MODAL FIX */
#userModal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:2000;
}

/* DARK BACKGROUND */
#userModal::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(5px);
}

/* MODAL BOX */
#userDetails{
  position:relative;
  max-width:400px;
  width:90%;
  animation: popup 0.3s ease;
}

@keyframes popup{
  from{transform:scale(0.7); opacity:0;}
  to{transform:scale(1); opacity:1;}
}

#userDetails{
  max-height:80vh;
  overflow-y:auto;
}

body.light{
  background:#f1f5f9;
  color:#111;
}

body.light .card,
body.light .sidebar{
  background:rgba(0,0,0,0.05);
  color:#111;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">🔥 Admin Panel</div>

<!-- LOGIN -->
<div id="login">
  <div class="glass">
    <h2>Admin Login</h2>
    <button onclick="login()" style="
  background:#2563eb;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
">
  🚀 Continue with Google
</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<div class="sidebar">
  <h3>Menu</h3>
  <button onclick="openNotifications()">🔔 Notifications (<span id="notiCountSidebar">0</span>)</button>
  <button onclick="loadStats()">Dashboard</button>
  <button onclick="loadUsers()">Users</button>
  <button onclick="loadApps()">Applications</button>
  <button onclick="exportUsers()">📥 Export Users</button>
  <button onclick="logout()">Logout</button>
</div>


<div class="topbar">

  <div class="top-left">
    <h2>🚀 Admin Panel</h2>
  </div>

  <div class="top-center">
    <div class="search-box">
      🔍
      <input placeholder="Search users, apps..."
        oninput="globalSearch(this.value)">
    </div>
  </div>

  <div class="top-right">

    <button class="icon-btn" onclick="openNotifications()">
      🔔 <span id="notiCountTop">0</span>
    </button>

    <button class="icon-btn" onclick="toggleTheme()">🌙</button>

    <div class="profile" id="profileBox">
      <span id="profileName">Admin</span>
    </div>

  </div>

</div>


<div class="main" id="mainContent"></div>

</div>

<div id="notiPanel">

  <!-- HEADER -->
  <div class="noti-header">
  <h3>🔔 Notifications</h3>

  <div style="display:flex; gap:10px;">
    <button onclick="clearNotifications()" style="
      background:#ef4444;
      border:none;
      padding:6px 10px;
      border-radius:8px;
      color:white;
      cursor:pointer;
    ">Clear</button>

    <button onclick="openNotifications()">✖</button>
  </div>
</div>

  <!-- LIST -->
  <div id="notiList"></div>

</div>

<!-- USER MODAL -->
<div id="userModal">
  <div class="glass" id="userDetails"></div>
</div>

<div id="overlay" onclick="closeNotifications()"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  signInWithPopup,
  GoogleAuthProvider,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  deleteDoc,
  updateDoc,
  onSnapshot,
  getDoc,   // 🔥 ADD HERE ONLY
  query,        // ✅ ADD THIS
  where         // ✅ ADD THIS
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyC8Gm9YHSl1biyUTAhz0h5NRF_9oTLEE0c",
  authDomain: "santhoshi-matha-consulta-594da.firebaseapp.com",
  projectId: "santhoshi-matha-consulta-594da",
  storageBucket: "santhoshi-matha-consulta-594da.firebasestorage.app",
  messagingSenderId: "1046832274742",
  appId: "1:1046832274742:web:2b6aad013799564420e797",
  measurementId: "G-PSCZPPBB5C"
};


console.log("%c Developed by RTH ⚡", "color:green;font-size:14px;");



const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const provider = new GoogleAuthProvider();


let isFirstLoadUsers = true;
let isFirstLoadApps = true;

let notifications = JSON.parse(localStorage.getItem("notifications")) || [];
let notiOpen = false;

let splashDone = false;

function hideSplashOnce(){
  if(splashDone) return;

  const splash = document.getElementById("splash");
  if(!splash) return;

  splashDone = true;

  splash.style.opacity = "0";
  splash.style.transition = "0.5s ease";

  setTimeout(()=>{
    splash.remove();
  }, 500);
}

/* 🔥 GOOGLE LOGIN */
window.login = async () => {
  try {
    provider.setCustomParameters({ prompt: "select_account" });

    await signInWithPopup(auth, provider);

    // ❌ DON'T CHECK ADMIN HERE
    // Auth listener will handle everything

  } catch (e) {
    alert(e.message);
  }
};

function showLogin() {
  document.getElementById("login").style.display = "flex";
  document.getElementById("dashboard").style.display = "none";
}

function showDashboard() {
  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "block";

  loadStats();
}

/* AUTO LOGIN CHECK */


onAuthStateChanged(auth, async (user) => {

  hideSplashOnce();

  if (!user) {
    showLogin();
    return;
  }

  try {
    console.log("UID:", user.uid);

    const adminRef = doc(db, "admins", user.uid);
const adminSnap = await getDoc(adminRef);

if (!adminSnap.exists()) {
  alert("Access Denied ❌ (Not Admin)");
  await signOut(auth);
  showLogin();
  return;
}

    showDashboard();

  } catch (err) {
    console.error(err);
    showLogin();
  }
});

/* DASHBOARD */
window.loadStats = async ()=>{
  let users = await getDocs(collection(db,"users"));
  let apps = await getDocs(collection(db,"applications"));
  let blockedUsers = 0;

users.forEach(doc=>{
  if(doc.data().blocked) blockedUsers++;
});

  document.getElementById("mainContent").innerHTML = `
  <h2 style="font-size:28px;">📊 Dashboard Overview</h2>

  <div style="display:flex; gap:20px; flex-wrap:wrap;">
  
  <div class="card" style="flex:1;">
    👥 Users <h1>${users.size}</h1>
  </div>

  <div class="card" style="flex:1;">
    🚫 Blocked <h1>${blockedUsers}</h1>
  </div>

  <div class="card" style="flex:1;">
    📄 Applications <h1>${apps.size}</h1>
  </div>

</div>

  <br>

  <canvas id="barChart"></canvas>
  <br>
  <canvas id="pieChart"></canvas>
`;

new Chart(document.getElementById("barChart"), {
  type: 'bar',
  data: {
    labels: ['Users', 'Applications'],
    datasets: [{
      label: 'Platform Data',
      data: [users.size, apps.size]
    }]
  }
});

new Chart(document.getElementById("pieChart"), {
  type: 'pie',
  data: {
    labels: ['Users', 'Applications'],
    datasets: [{
      data: [users.size, apps.size]
    }]
  }
});
};

/* USERS */
window.loadUsers = ()=>{
  onSnapshot(collection(db,"users"), (snapshot)=>{

  if(isFirstLoadUsers){
    isFirstLoadUsers = false;
    return;
  }
    let html = `
<h2 style="margin-bottom:20px;">👥 Users</h2>

<input placeholder="Search Users..." 
oninput="searchUsers(this.value)"
style="padding:10px; width:250px; border-radius:10px; border:none; margin-bottom:10px;">

<br>

<select onchange="filterUsers(this.value)" 
style="padding:10px; border-radius:10px; margin-bottom:20px;">
  <option value="all">All Users</option>
  <option value="active">Active Users</option>
  <option value="blocked">Blocked Users</option>
</select>

<div style="
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
">
`;

    snapshot.forEach(docu=>{
      let d = docu.data();
      d.uid = docu.id; // 🔥 ADD THIS

      html += `
      <div class="user-card" onclick='openUser(${JSON.stringify(d)})'>
        
        <div class="avatar">
          ${(d.name || d.email || "U")[0].toUpperCase()}
        </div>

        <h3>${d.name || d.email?.split("@")[0] || "User"}</h3>
        <p>${d.email}</p>

        <div class="status ${d.blocked ? "blocked":"active"}">
          ${d.blocked ? "Blocked ❌":"Active ✅"}
        </div>

      </div>`;
    });

    html += `</div>`;

    document.getElementById("mainContent").innerHTML = html;
  });
};

/* USER DETAILS */
window.openUser = (data)=>{
  let modal = document.getElementById("userModal");
  let box = document.getElementById("userDetails");

  box.innerHTML = `
  <div style="text-align:center">

    <div style="
      width:80px;
      height:80px;
      border-radius:50%;
      background:linear-gradient(135deg,#2563eb,#9333ea);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      margin:auto;
      margin-bottom:15px;
    ">
      ${data.name ? data.name[0].toUpperCase() : "U"}
    </div>

    <h2>${data.name || data.email?.split("@")[0] || "User"}</h2>
    <p style="opacity:0.7">${data.email}</p>

    <div style="
      margin-top:15px;
      background:rgba(255,255,255,0.05);
      padding:15px;
      border-radius:15px;
      text-align:left;
    ">
      📱 <b>Mobile:</b> ${data.mobile || "N/A"} <br><br>
      🆔 <b>UID:</b> ${data.uid || "N/A"}
    </div>

    <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">

      <button onclick='downloadUser("${data.email}")' class="btn blue">⬇ Download</button>

      <button onclick='blockUser("${data.uid}")' class="btn orange">
  ${data.blocked ? "✅ Unblock" : "🚫 Block"}
</button>

      <button onclick='deleteUser("${data.uid}")' class="btn red">🗑 Delete</button>

    </div>

    <br>
    <button onclick='closeModal()' class="btn">Close</button>

  </div>
  `;

  modal.style.display="flex";
};

document.getElementById("userModal").addEventListener("click",(e)=>{
  if(e.target === document.getElementById("userModal")){
    closeModal();
  }
});

window.closeModal = ()=>{
  document.getElementById("userModal").style.display="none";
};

/* DOWNLOAD */
window.downloadUser = async (email)=>{

  // 🔥 GET USER DIRECTLY (BEST METHOD)
  let userQuery = query(collection(db,"users"), where("email","==",email));
  let userSnap = await getDocs(userQuery);

  let userData = null;

  userSnap.forEach(doc=>{
    userData = doc.data();
  });

  // 🔥 GET APPLICATIONS
  let appQuery = query(collection(db,"applications"), where("email","==",email));
  let appSnap = await getDocs(appQuery);

  let applications = [];

  appSnap.forEach(doc=>{
    applications.push(doc.data());
  });

  // 🔥 BACKUP CHECK (userEmail field)
  if(applications.length === 0){
    let altQuery = query(collection(db,"applications"), where("userEmail","==",email));
    let altSnap = await getDocs(altQuery);

    altSnap.forEach(doc=>{
      applications.push(doc.data());
    });
  }

  // 🔥 FINAL NAME FIX (VERY IMPORTANT)
  let userName =
    userData?.name ||
    applications[0]?.name ||
    email.split("@")[0];

  let mobile =
    userData?.mobile ||
    applications[0]?.mobile ||
    "N/A";

  let status =
    userData?.blocked ? "Blocked ❌" : "Active ✅";

  let line = "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━";

  let content = `
${line}
        🚀 USER FULL REPORT
${line}

👤 Name        : ${userName}
📧 Email       : ${email}
📱 Mobile      : ${mobile}
🚦 Status      : ${status}

📅 Generated   : ${new Date().toLocaleString()}

${line}
📊 SUMMARY
${line}

Total Applications : ${applications.length}

${line}
📄 APPLICATION DETAILS
${line}
`;

  if(applications.length === 0){
    content += `No Applications ❌\n${line}`;
  }

  applications.forEach((d,i)=>{
    content += `

🔹 APPLICATION ${i+1}
${line}

📌 Type          : ${d.type || "N/A"}
📊 Status        : ${d.status || "Pending"}

👤 Name          : ${d.name || userName}
📧 Email         : ${d.email || d.userEmail || "N/A"}
📱 Mobile        : ${d.mobile || mobile}

🎓 Qualification : ${d.qualification || "N/A"}
📅 Year          : ${d.yop || "N/A"}
💼 Experience    : ${d.experience || "N/A"}

🏢 Company       : ${d.company || "N/A"}
📍 Location      : ${d.location || "N/A"}
📌 Job Location  : ${d.jobLocation || "N/A"}

🏫 College       : ${d.college || "N/A"}
📊 Percentage    : ${d.percentage || "N/A"}
🎂 DOB           : ${d.dob || "N/A"}

📝 Message:
${(d.message || "N/A").replace(/</g,"").replace(/>/g,"")}

${line}
`;
  });

  // 🔥 DOWNLOAD FILE WITH USER NAME (FIXED)
  let blob = new Blob(["\uFEFF" + content], {
  type: "text/plain;charset=utf-8"
});
  let a = document.createElement("a");

  a.href = URL.createObjectURL(blob);

  // ✅ FILE NAME PERFECT
  a.download = `${userName.replace(/\s+/g,"_")}_Report.txt`;

  a.click();
};
/* BLOCK */
window.blockUser = async (uid)=>{

  let userRef = doc(db,"users",uid);
  let snap = await getDoc(userRef);

  if(!snap.exists()) return;

  let current = snap.data().blocked;

  await updateDoc(userRef,{
    blocked: !current   // 🔥 TOGGLE
  });

  alert(!current ? "User Blocked 🚫" : "User Unblocked ✅");
};

/* DELETE */
window.deleteUser = async (uid)=>{
  if(auth.currentUser.uid === uid){
  alert("You can't delete yourself ❌");
  return;
}

await deleteDoc(doc(db,"users",uid));
  alert("Deleted ✅");
  loadUsers();
};

/* APPLICATIONS */
window.loadApps = async ()=>{
  let snap = await getDocs(collection(db,"applications"));

  let html = `
  <h2>📄 Applications</h2>

  <input placeholder="Search..." oninput="searchApps(this.value)" 
  style="padding:10px; width:250px; border-radius:10px; border:none; margin-bottom:20px;">
  
  <div id="appsContainer" style="
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
  ">
  `;

  snap.forEach(doc=>{
    let d = doc.data();
    d.id = doc.id;

    html += renderAppCard(d);
  });

  html += "</div>";

  document.getElementById("mainContent").innerHTML = html;
};

function renderAppCard(d){
  return `
  <div class="card">

    <h3>${d.name || "User"}</h3>
    <p>${d.email || d.userEmail}</p>

    <p>📌 ${d.type}</p>

    <div style="margin-top:10px;">
      <span style="background:#f59e0b;padding:5px 10px;border-radius:10px;">
        ${d.status || "Pending"}
      </span>
    </div>

    <br>

    <!-- 🔥 ACTION BUTTONS -->
    <div style="display:flex; gap:8px; flex-wrap:wrap;">

      <button class="btn blue" onclick="updateStatus('${d.id}','Approved')">
        ✅ Approve
      </button>

      <button class="btn red" onclick="updateStatus('${d.id}','Rejected')">
        ❌ Reject
      </button>

      <!-- 🔥 NEW -->
      <button class="btn orange" onclick='downloadApplication(${JSON.stringify(d)})'>
        ⬇ Download
      </button>

      <!-- 🔥 NEW -->
      <button class="btn" onclick='viewApplication(${JSON.stringify(d)})'>
        👁 View
      </button>

      <!-- 🔥 NEW -->
      <button class="btn red" onclick="deleteApplication('${d.id}')">
        🗑 Delete
      </button>

    </div>

  </div>
  `;
}

window.downloadApplication = (data)=>{

  let content = `
📄 APPLICATION FORM

👤 Name: ${data.name || "N/A"}
📧 Email: ${data.email || data.userEmail || "N/A"}
📱 Mobile: ${data.mobile || "N/A"}

📌 Type: ${data.type || "N/A"}
📊 Status: ${data.status || "Pending"}

🎓 Qualification: ${data.qualification || "N/A"}
📅 Year: ${data.yop || "N/A"}
💼 Experience: ${data.experience || "N/A"}

🏢 Company: ${data.company || "N/A"}
📍 Location: ${data.location || "N/A"}

📝 Message:
${data.message || "N/A"}

📅 Generated: ${new Date().toLocaleString()}
`;

  let blob = new Blob([content], {type:"text/plain"});
  let a = document.createElement("a");

  a.href = URL.createObjectURL(blob);
  a.download = `${(data.name || "Application")}_Form.txt`;

  a.click();
};

window.viewApplication = (data)=>{

  let modal = document.getElementById("userModal");
  let box = document.getElementById("userDetails");

  box.innerHTML = `
    <h2>📄 Application Details</h2>

    <p><b>Name:</b> ${data.name}</p>
    <p><b>Email:</b> ${data.email || data.userEmail}</p>
    <p><b>Mobile:</b> ${data.mobile}</p>

    <p><b>Type:</b> ${data.type}</p>
    <p><b>Status:</b> ${data.status || "Pending"}</p>

    <p><b>Qualification:</b> ${data.qualification}</p>
    <p><b>Experience:</b> ${data.experience}</p>

    <p><b>Message:</b> ${data.message}</p>

    <br>
    <button onclick="closeModal()" class="btn">Close</button>
  `;

  modal.style.display = "flex";
};

window.deleteApplication = async (id)=>{
  if(!confirm("Delete this application?")) return;

  await deleteDoc(doc(db,"applications",id));

  showToast("Application Deleted 🗑");
  loadApps();
};

window.updateStatus = async (id, status)=>{
  await updateDoc(doc(db,"applications",id),{
    status: status
  });

  showToast("Updated to " + status);
  loadApps();
};

window.searchApps = async (text)=>{
  let snap = await getDocs(collection(db,"applications"));

  let container = document.getElementById("appsContainer");
  container.innerHTML = "";

  snap.forEach(doc=>{
    let d = doc.data();

    if(
      d.name?.toLowerCase().includes(text.toLowerCase()) ||
      d.email?.toLowerCase().includes(text.toLowerCase())
    ){
      container.innerHTML += renderAppCard({...d, id:doc.id});
    }
  });
};

window.searchUsers = (text)=>{
  let cards = document.querySelectorAll(".user-card");

  cards.forEach(card=>{
    let name = card.innerText.toLowerCase();

    card.style.display = name.includes(text.toLowerCase()) ? "block" : "none";
  });
};


/* 🔥 LIVE USERS */
onSnapshot(collection(db,"users"), (snapshot)=>{

  snapshot.docChanges().forEach(change=>{
    if(change.type === "added"){

      const d = change.doc.data();

      const msg = `🆕 ${d.name || "User"} joined at ${new Date().toLocaleTimeString()}`;

      notifications.unshift(msg);
updateNotiUI();
playSound();
showToast(msg);

      // auto open only if panel is closed
      if(!notiOpen){
        openNotifications();
      }
    }
  });

});

/* 🔥 LIVE APPLICATIONS */
onSnapshot(collection(db,"applications"), (snapshot)=>{

  if(isFirstLoadApps){
    isFirstLoadApps = false;
    return;
  }

  snapshot.docChanges().forEach(change=>{
    if(change.type === "added"){

      const d = change.doc.data();

      const msg = `📄 Application from ${d.email || d.userEmail} at ${new Date().toLocaleTimeString()}`;

      notifications.unshift(msg);
updateNotiUI();
playSound();
showToast(msg);

      if(!notiOpen){
        openNotifications();
      }
    }
  });

});


window.openNotifications = function(){
  notiOpen = !notiOpen;

  const panel = document.getElementById("notiPanel");
  const overlay = document.getElementById("overlay");

  if(notiOpen){
    panel.classList.add("active");
    overlay.style.display = "block";
  } else {
    panel.classList.remove("active");
    overlay.style.display = "none";
  }
};

function closeNotifications(){
  notiOpen = false;
  document.getElementById("notiPanel").classList.remove("active");
  document.getElementById("overlay").style.display = "none";
}

function updateNotiUI(){
  const countEl = document.getElementById("notiCount");
  const listEl = document.getElementById("notiList");

  if(!countEl || !listEl) return;

  countEl.innerText = notifications.length;

  listEl.innerHTML = notifications
    .slice(0, 30)
    .map(n => `<div class="noti-item">${n}</div>`)
    .join("");

  // 🔥 SAVE PERMANENT
  localStorage.setItem("notifications", JSON.stringify(notifications));
}

updateNotiUI();

window.globalSearch = async (text) => {

  let usersSnap = await getDocs(collection(db,"users"));
  let appsSnap = await getDocs(collection(db,"applications"));

  let html = `<h2>🔍 Search Results</h2>`;

  usersSnap.forEach(doc=>{
    let d = doc.data();
    if(d.name?.toLowerCase().includes(text.toLowerCase()) || d.email?.toLowerCase().includes(text.toLowerCase())){
      html += `<div class="card">👤 ${d.name || "User"} - ${d.email}</div>`;
    }
  });

  appsSnap.forEach(doc=>{
    let d = doc.data();
    if(d.name?.toLowerCase().includes(text.toLowerCase()) || d.email?.toLowerCase().includes(text.toLowerCase())){
      html += `<div class="card">📄 ${d.name} - ${d.type}</div>`;
    }
  });

  document.getElementById("mainContent").innerHTML = html;
};

window.filterUsers = (type)=>{
  let cards = document.querySelectorAll(".user-card");

  cards.forEach(card=>{
    let text = card.innerText;

    if(type === "all") card.style.display="block";
    else if(type === "active" && text.includes("Active")) card.style.display="block";
    else if(type === "blocked" && text.includes("Blocked")) card.style.display="block";
    else card.style.display="none";
  });
};

window.exportUsers = async ()=>{

  let usersSnap = await getDocs(collection(db,"users"));
  let appsSnap = await getDocs(collection(db,"applications"));

  let line = "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━";

  let content = `
${line}
        🚀 COMPLETE PLATFORM REPORT
${line}

📅 Generated : ${new Date().toLocaleString()}

👥 Total Users : ${usersSnap.size}

${line}
`;

  let userIndex = 0;

  usersSnap.forEach(userDoc => {

    userIndex++;

    let user = userDoc.data();
    let uid = userDoc.id;

    let userApps = [];

    appsSnap.forEach(appDoc => {
      let app = appDoc.data();

      if(app.userEmail === user.email || app.email === user.email){
        userApps.push(app);
      }
    });

    // ✅🔥 NAME FIX (IMPORTANT)
    let userName =
      user.name ||
      userApps[0]?.name ||
      (user.email ? user.email.split("@")[0] : "User");

    let mobile =
      user.mobile ||
      userApps[0]?.mobile ||
      "N/A";

    content += `

${line}
👤 USER ${userIndex}
${line}

🆔 UID        : ${uid}
👤 Name       : ${userName}
📧 Email      : ${user.email || "N/A"}
📱 Mobile     : ${mobile}
🚦 Status     : ${user.blocked ? "Blocked ❌" : "Active ✅"}

📊 Applications Count : ${userApps.length}

${line}
📄 APPLICATIONS
${line}
`;

    if(userApps.length === 0){
      content += `No Applications ❌\n`;
    }

    userApps.forEach((app,i)=>{

      content += `

🔹 APP ${i+1}

📌 Type          : ${app.type || "N/A"}
📊 Status        : ${app.status || "Pending"}

👤 Name          : ${app.name || userName}
📧 Email         : ${app.email || app.userEmail || "N/A"}
📱 Mobile        : ${app.mobile || mobile}

🎓 Qualification : ${app.qualification || "N/A"}
📅 Year          : ${app.yop || "N/A"}
💼 Experience    : ${app.experience || "N/A"}

🏢 Company       : ${app.company || "N/A"}
📍 Location      : ${app.location || "N/A"}

📝 Message:
${(app.message || "N/A").replace(/</g,"").replace(/>/g,"")}

${line}
`;
    });

  });

  let blob = new Blob(["\uFEFF" + content], {
  type:"text/plain;charset=utf-8"
});
  let a = document.createElement("a");

  a.href = URL.createObjectURL(blob);

  // ✅ OPTIONAL: file name better
  a.download = `Full_Report_${new Date().getTime()}.txt`;

  a.click();
};


window.clearNotifications = () => {
  notifications = [];

  // 🔥 LOCAL STORAGE CLEAR
  localStorage.removeItem("notifications");

  updateNotiUI();
};



window.toggleTheme = () => {
  document.body.classList.toggle("light");
};


window.logout = async () => {
  try {
    await signOut(auth);

    // 🔥 IMPORTANT: full reset
    location.reload();

  } catch (error) {
    console.error(error);
    alert("Logout failed ❌");
  }
};



function playSound(){
  const audio = new Audio("https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3");
  audio.play();
}

function showToast(msg){
  const toast = document.createElement("div");
  toast.innerText = msg;

  toast.style.position = "fixed";
  toast.style.bottom = "20px";
  toast.style.right = "20px";
  toast.style.background = "#2563eb";
  toast.style.padding = "12px 18px";
  toast.style.borderRadius = "10px";
  toast.style.boxShadow = "0 5px 20px rgba(0,0,0,0.5)";
  toast.style.zIndex = "9999";

  document.body.appendChild(toast);

  setTimeout(()=> toast.remove(), 3000);
}
